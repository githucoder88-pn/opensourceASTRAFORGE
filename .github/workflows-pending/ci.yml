name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing

  demo:
    # Deliberately a BARE install (no dev extras). The flagship demo once
    # depended on pytest and passed only in the dev environment; this job
    # exists so that can never regress.
    name: Examples run from a bare install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .

      # The README promises this works. Prove it on every commit.
      - name: Run the flagship demo
        run: |
          mkdir demo && cd demo
          astraforge init .
          astraforge run "Fix the failing statistics module" \
            --plan ../examples/software_engineering/plan.yaml -y
          astraforge verify latest

      - name: Every example runs
        run: |
          cd demo
          for plan in ../examples/*/plan.yaml; do
            echo "::group::$plan"
            astraforge run "CI check for $plan" --plan "$plan" -y
            echo "::endgroup::"
          done

  build:
    name: Package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
