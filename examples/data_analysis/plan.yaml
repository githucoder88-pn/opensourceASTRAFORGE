# Data analysis: CSV -> anomaly detection -> chart -> report.
#
# Uses only the Python standard library, so it runs anywhere pytest runs.
# The verification is what matters: the report must contain the anomaly the
# analysis was supposed to find, and the JSON findings must parse.
#
#   astraforge run "Analyse sensor readings and report anomalies" \
#       --plan examples/data_analysis/plan.yaml -y

assumptions:
  - The dataset is generated by the plan, so the run is fully reproducible.
  - Only the Python standard library is required.
objectives:
  - Produce a dataset, detect anomalies in it, and report them with evidence.
risk: MEDIUM

tasks:
  - task_id: task_dataset
    description: Create the sensor readings dataset.
    tool: fs.write
    expected_output: readings.csv with two deliberate outliers
    tool_input:
      path: readings.csv
      content: |
        timestamp,sensor,temperature_c
        2026-01-01T00:00,s1,20.1
        2026-01-01T01:00,s1,20.4
        2026-01-01T02:00,s1,19.8
        2026-01-01T03:00,s1,20.2
        2026-01-01T04:00,s1,91.7
        2026-01-01T05:00,s1,20.0
        2026-01-01T06:00,s1,20.3
        2026-01-01T07:00,s1,-40.5
        2026-01-01T08:00,s1,20.1
        2026-01-01T09:00,s1,20.6
    verification:
      - verifier: file
        description: the dataset exists with a header row
        params:
          path: readings.csv
          min_bytes: 100
          contains: ["timestamp,sensor,temperature_c"]

  - task_id: task_analysis_script
    description: Write the anomaly detection script (modified z-score over the median).
    tool: fs.write
    depends_on: [task_dataset]
    expected_output: analyse.py
    tool_input:
      path: analyse.py
      content: |
        """Detect temperature anomalies using a median absolute deviation score.

        MAD is used instead of a mean/standard-deviation z-score because the
        outliers we are looking for would themselves inflate the standard
        deviation and hide the very anomalies we want to find.
        """

        import csv
        import json
        import statistics

        THRESHOLD = 3.5

        with open("readings.csv", newline="", encoding="utf-8") as fh:
            rows = list(csv.DictReader(fh))

        values = [float(r["temperature_c"]) for r in rows]
        median = statistics.median(values)
        mad = statistics.median([abs(v - median) for v in values]) or 1e-9

        anomalies = []
        for row, value in zip(rows, values):
            score = 0.6745 * (value - median) / mad
            if abs(score) > THRESHOLD:
                anomalies.append(
                    {
                        "timestamp": row["timestamp"],
                        "temperature_c": value,
                        "score": round(score, 2),
                    }
                )

        findings = {
            "readings": len(values),
            "median_c": median,
            "threshold": THRESHOLD,
            "anomaly_count": len(anomalies),
            "anomalies": anomalies,
        }
        with open("findings.json", "w", encoding="utf-8") as fh:
            json.dump(findings, fh, indent=2)

        # A dependency-free horizontal bar chart, so the example needs no plotting library.
        lo, hi = min(values), max(values)
        span = (hi - lo) or 1.0
        chart = ["Temperature over time (| marks an anomaly)", ""]
        flagged = {a["timestamp"] for a in anomalies}
        for row, value in zip(rows, values):
            width = int((value - lo) / span * 40)
            mark = "|" if row["timestamp"] in flagged else " "
            chart.append(f"{row['timestamp']} {mark} {'#' * width:<40} {value:>7.1f}")
        with open("chart.txt", "w", encoding="utf-8") as fh:
            fh.write("\n".join(chart) + "\n")

        lines = [
            "# Sensor anomaly report",
            "",
            f"Analysed **{len(values)}** readings; median {median} C.",
            f"Flagged **{len(anomalies)}** anomalies at |modified z| > {THRESHOLD}.",
            "",
            "## Anomalies",
            "",
            "| Timestamp | Temperature (C) | Score |",
            "| --- | --- | --- |",
        ]
        lines += [
            f"| {a['timestamp']} | {a['temperature_c']} | {a['score']} |"
            for a in anomalies
        ]
        lines += ["", "## Chart", "", "```", *chart, "```", ""]
        with open("report.md", "w", encoding="utf-8") as fh:
            fh.write("\n".join(lines))

        print(f"analysed {len(values)} readings, found {len(anomalies)} anomalies")
    verification:
      - verifier: file
        description: the analysis script exists
        params:
          path: analyse.py
          min_bytes: 500

  - task_id: task_run_analysis
    description: Run the analysis over the dataset.
    tool: shell.run
    depends_on: [task_analysis_script]
    expected_output: findings.json, chart.txt and report.md
    risk: MEDIUM
    tool_input:
      command: ["python", "analyse.py"]
    verification:
      - verifier: command
        description: the analysis runs cleanly and reports the expected anomaly count
        params:
          command: ["python", "analyse.py"]
          stdout_contains: ["found 2 anomalies"]
          stdout_excludes: ["Traceback", "No module named"]

  - task_id: task_verify_findings
    description: Verify the findings are well-formed and identify the real outliers.
    tool: fs.read
    depends_on: [task_run_analysis]
    expected_output: confirmation that both planted outliers were detected
    tool_input:
      path: findings.json
    verification:
      - verifier: schema
        description: findings.json parses and has the expected fields
        params:
          path: findings.json
          required_keys: ["readings", "median_c", "anomaly_count", "anomalies"]
      - verifier: file
        description: both planted outliers (91.7 and -40.5) were actually found
        params:
          path: findings.json
          contains: ["91.7", "-40.5"]
      - verifier: file
        description: the human-readable report was produced with a chart
        params:
          path: report.md
          min_bytes: 200
          contains: ["# Sensor anomaly report", "## Chart"]
